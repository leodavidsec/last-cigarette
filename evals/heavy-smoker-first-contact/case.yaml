schema_version: "1.1"
name: heavy-smoker-first-contact
expected_outcome: |
  Recognises high dependence (first cigarette within 10 minutes, 30 a day) and says medication is strongly indicated; offers a cutting-down-to-quit plan with scheduled smoking and a quit date within a few weeks rather than insisting on cold turkey; names cytisine (Defumoxan, sold without prescription in Romania) and/or varenicline and combination NRT as options, noting that a patch alone and under-dosing are common reasons "patches didn't work"; routes the medical decision to a pharmacist or doctor; flags Friday drinking as the main relapse risk with a concrete plan; addresses the morning-coffee trigger specifically; gives the honest shape of the COPD evidence (stopping is the one thing that slows the decline; the cough may briefly worsen before it improves); gives one or two things to do today; asks who at home knows or suggests telling someone. Non-judgmental tone, no lecture on health risks.
