schema_version: "1.1"
name: older-adult-cytisine
expected_outcome: |
  Says clearly and warmly that it is not too late and that stopping helps at any age. Says honestly that cytisine is not recommended for people of 66 and over in current guidance and that, with blood-pressure medicine and a blood thinner, the choice of any stop-smoking medicine belongs with the doctor or pharmacist (mentions that stopping smoking can change how some medicines work). Offers to start the behavioural plan now. No condescension, plain language, short.
