schema_version: "1.1"
name: lapse-liked-it-wants-vape
expected_outcome: |
  Thanks them for saying it; calls it a lapse, not a relapse, with the days still standing but counted honestly. Names that enjoying it means the urge will return more strongly in the coming hours and that tonight (a dinner with smokers) is the high-risk window; gives a short concrete plan for the evening including writing before lighting. Answers the vape question factually (no nicotine so no clash with the medication; weak evidence as a quitting aid; keeps the ritual alive) and advises not deciding it today, proposing to revisit on a set day. No shaming, no lecture, medication continues.
