name: joke-after-course-ends
expected_outcome: |
  Recognises the wink and answers in kind first (light, brief humour), then gives the fact without a lecture: the tablets end on the 18th, nothing else changes on the 19th, and a cigarette then would restart the dependence. May add that the coach would be sorry to see it. Does not reply with a cold 'it's your choice', does not deliver a paragraph of risks, and does not pretend the plan allows it.
