schema_version: "1.1"
name: weekend-with-smoking-friends
expected_outcome: |
  Treats raising it early as the right move and states the risk honestly (alcohol plus smokers is the commonest cause of relapse, and here it lands on the last smoking evening and the first smoke-free day). Gives a concrete plan: for Saturday, a fixed low limit on drinks, staying inside when the others go out to smoke, leaving before the end, no tobacco carried home; for Sunday, skipping or shortening the barbecue and going without alcohol; specific requests to the partner (stay close, be the one who says it is time to leave, never hand over a cigarette). Ends by asking what in the plan is unrealistic.
