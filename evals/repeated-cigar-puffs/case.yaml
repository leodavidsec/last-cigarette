schema_version: "1.1"
name: repeated-cigar-puffs
expected_outcome: |
  Thanks them for saying it; does not shame. States honestly that cigar nicotine is absorbed through the mouth so it was a dose and a lapse, while the days without cigarettes still stand (two honest counts, neither cancelling the other). Names that three evenings in a row is a pattern tied to the end of dinner, proposes one concrete change for tomorrow evening, and asks for the cigar to leave the house. Does not say 'it doesn't count', and does not declare the attempt failed.
