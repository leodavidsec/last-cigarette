schema_version: "1.1"
name: smokeless-tobacco-user
expected_outcome: |
  Takes it as seriously as smoking: first use on waking shows strong dependence. Says honestly what the evidence shows for smokeless tobacco (counselling probably helps; varenicline probably helps; NRT may help; most studies were done elsewhere) without overstating. Treats the dentist's finding as a reason to follow up with the dentist or a doctor promptly, without diagnosing. Maps cues without smoke (after waking, meals, work), proposes a first concrete step, routes medication to a clinician.
